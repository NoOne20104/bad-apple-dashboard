
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bad Apple Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #141011;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      background: #24191d;
      padding: 24px;
      border-bottom: 1px solid #493039;
    }

    h1 {
      margin: 0;
      color: #e85d6a;
    }

    main {
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: #24191d;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .entry {
      background: #1b1e27;
      border: 1px solid #493039;
      border-radius: 12px;
      padding: 16px;
      margin-top: 14px;
    }

    .entry h3 {
      margin-top: 0;
      overflow-wrap: anywhere;
    }

    .entry-content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid #493039;
      border-radius: 10px;
      background: #141011;
      color: white;
      font-size: 15px;
    }

    button {
      background: #e85d6a;
      color: #141011;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: bold;
      cursor: pointer;
      margin: 4px 8px 8px 0;
    }

    button:hover:not(:disabled) {
      background: #ff7985;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .muted {
      color: #c4aeb2;
    }

    .hidden {
      display: none;
    }

    #message,
    #historyStatus {
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <header>
    <h1>Bad Apple</h1>
    <p class="muted">Web Dashboard</p>
  </header>

  <main>

    <!-- LOGIN -->
    <section class="card" id="loginSection">
      <h2>Cloud Account</h2>

      <p class="muted">
        Sign in with the same account as your Android app.
      </p>

      <form id="loginForm">
        <input
          type="email"
          id="email"
          placeholder="Email address"
          autocomplete="email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="loginButton">
          Sign In
        </button>
      </form>

      <p id="message" class="muted" role="status"></p>
    </section>

    <!-- DASHBOARD -->
    <div id="dashboardSection" class="hidden">

      <section class="card">
        <h2>Connected Account</h2>

        <p id="accountEmail" class="muted"></p>

        <button id="logoutButton" type="button">
          Sign Out
        </button>
      </section>

      <section class="card">
        <h2>Saved History</h2>

        <p class="muted">
          View history available in your cloud account.
        </p>

        <button id="getLogButton" type="button">
          Get Log
        </button>

        <p id="historyStatus" class="muted" role="status">
          Click Get Log to load your history.
        </p>

        <div id="historyResults"></div>
      </section>

    </div>

  </main>

  <!-- SUPABASE LIBRARY -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    const SUPABASE_URL =
      "https://jetdswxcgusiwmgrhuyv.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_CH5Bkm2nqFJJaT1PBTOtcw_K9DkVmAE";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginSection =
      document.getElementById("loginSection");

    const dashboardSection =
      document.getElementById("dashboardSection");

    const accountEmail =
      document.getElementById("accountEmail");

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("loginButton");

    const getLogButton =
      document.getElementById("getLogButton");

    const historyStatus =
      document.getElementById("historyStatus");

    const historyResults =
      document.getElementById("historyResults");

    // Clear records whenever the account changes
    function clearHistory() {
      historyResults.replaceChildren();
      historyStatus.textContent =
        "Click Get Log to load your history.";
    }

    function showLoggedOut() {
      loginSection.classList.remove("hidden");
      dashboardSection.classList.add("hidden");
      accountEmail.textContent = "";
      clearHistory();
    }

    function showLoggedIn(user) {
      clearHistory();
      loginSection.classList.add("hidden");
      dashboardSection.classList.remove("hidden");
      accountEmail.textContent =
        user.email || "Signed in";
    }

    // Check existing login session
    async function checkSession() {
      try {
        const { data, error } =
          await client.auth.getUser();

        if (error || !data.user) {
          showLoggedOut();
        } else {
          showLoggedIn(data.user);
        }
      } catch (error) {
        showLoggedOut();
        message.textContent =
          "Unable to check your session.";
      }
    }

    // Sign in
    document.getElementById("loginForm")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        loginButton.disabled = true;
        message.textContent = "Signing in...";

        try {
          const { data, error } =
            await client.auth.signInWithPassword({
              email,
              password
            });

          if (error) {
            message.textContent = error.message;
            return;
          }

          if (data.user) {
            document.getElementById("password").value = "";
            message.textContent = "";
            showLoggedIn(data.user);
          }
        } catch (error) {
          message.textContent =
            "Unable to connect. Please try again.";
        } finally {
          loginButton.disabled = false;
        }
      });

    // Sign out
    document.getElementById("logoutButton")
      .addEventListener("click", async () => {
        getLogButton.disabled = true;

        try {
          const { error } = await client.auth.signOut();

          if (error) {
            alert(error.message);
            return;
          }

          showLoggedOut();
        } finally {
          getLogButton.disabled = false;
        }
      });

    // Load existing cloud history
    async function getLog() {
      getLogButton.disabled = true;
      historyStatus.textContent = "Loading history...";
      historyResults.replaceChildren();

      try {
        const { data: userData, error: userError } =
          await client.auth.getUser();

        if (userError || !userData.user) {
          showLoggedOut();
          return;
        }

        const requestedUserId = userData.user.id;

        const { data, error } = await client
          .from("saved_logs")
          .select(
            "id, source_app, content, recorded_at"
          )
          .eq("user_id", requestedUserId)
          .order("recorded_at", {
            ascending: false
          })
          .limit(500);

        if (error) {
          throw error;
        }

        // Avoid showing results after an account switch
        const { data: latestUser } =
          await client.auth.getUser();

        if (
          latestUser.user?.id !== requestedUserId
        ) {
          clearHistory();
          return;
        }

        if (!data || data.length === 0) {
          historyStatus.textContent =
            "No cloud history available.";
          return;
        }

        historyStatus.textContent =
          `Showing ${data.length} saved records` +
          (data.length === 500
            ? " (first 500 only)."
            : ".");

        for (const entry of data) {
          const card =
            document.createElement("article");
          card.className = "entry";

          const app =
            document.createElement("h3");
          app.textContent =
            entry.source_app || "Unknown app";

          const time =
            document.createElement("p");
          time.className = "muted";
          time.textContent = entry.recorded_at
            ? new Date(
                entry.recorded_at
              ).toLocaleString()
            : "Unknown time";

          const content =
            document.createElement("p");
          content.className = "entry-content";
          content.textContent =
            entry.content || "";

          card.append(app, time, content);
          historyResults.appendChild(card);
        }
      } catch (error) {
        historyStatus.textContent =
          "Could not load history: " +
          (error.message || "Unknown error");
      } finally {
        getLogButton.disabled = false;
      }
    }

    getLogButton.addEventListener("click", getLog);

    checkSession();
  </script>

</body>
</html>
